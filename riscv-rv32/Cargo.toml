[package]
name = "riscv-rv32"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RV32IMC(A)(F)(Zb*, Zcb, Zcmp) interpreter for the ESP32-C3, C6 and P4 RISC-V cores"

[features]
# The WebAssembly JIT backend: sbc-emu's page (`env.sbc_jit_compile`, `env.sbc_jit_reset`) with
# `wasm-jit`, this repository's (`web/wasm/jit.mjs`: `env.host_jit_compile`,
# `env.host_jit_release`) with `wasm-jit-host`
wasm-jit = []
wasm-jit-host = []

[dependencies]
emu-core = { path = "../emu-core" }
