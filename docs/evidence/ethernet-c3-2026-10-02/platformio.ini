[env:c3]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.38-1
board = esp32-c3-devkitm-1
framework = arduino
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0
  -DNET_URL=\"${sysenv.NET_URL}\"

[env:wpa2]
extends = env:c3
build_flags = ${env:c3.build_flags}
  -DNET_PSK=\"esp32sim-pass\"

[env:s3]
extends = env:c3
board = esp32-s3-devkitc-1

[env:c6]
extends = env:c3
board = esp32-c6-devkitc-1
